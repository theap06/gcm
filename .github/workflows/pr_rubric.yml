name: PR Python Targeted CI

on:
  pull_request:
    paths:
      - 'gcm/**/*.py'
      - 'gcm/**/*.pyi'
      - 'pyproject.toml'
      - 'dev-requirements.txt'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  python-targeted-checks:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install -r dev-requirements.txt
          python -m pip install --no-deps -e .

      - name: nox lint
        run: nox -s lint

      - name: nox typecheck
        run: nox -s typecheck
